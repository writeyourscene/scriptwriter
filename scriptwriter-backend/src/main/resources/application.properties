spring.application.name=scriptwriter-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://scriptwriter-writeyourscene-6d2e.k.aivencloud.com:15982/defaultdb?sslmode=require
spring.datasource.username=avnadmin
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Database Connection Pool Optimization (Aiven/Neon limits)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=20000
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT (use environment variables in production)
jwt.secret=${JWT_SECRET:c2NyaXB0d3JpdGVySldUU2VjcmV0S2V5Rm9yU2NyaXB0V3JpdGVyQXBwMjAyNg==}
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=604800000

# Auth
auth.max-failed-attempts=5
auth.lock-duration-minutes=15

# OTP
otp.expiry-minutes=5

# Google OAuth (set to true when configured)
google.oauth.enabled=false

# Projects
project.trash-retention-days=30

# AI
ai.provider=stub

# Script editor
script.autosave-debounce-ms=2000

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_dummy}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:dummy_secret}

